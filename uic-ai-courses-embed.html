  Widget.prototype.syncControls = function () {
    var f = this.state.f, self = this;
    this.$$("input[data-f]").forEach(function (i) { i.checked = f[i.getAttribute("data-f")].indexOf(i.value) >= 0; });
    this.$$("input[data-t]").forEach(function (i) { i.checked = !!f[i.getAttribute("data-t")]; });
    this.$$("[data-rel]").forEach(function (b) { b.setAttribute("aria-pressed", f.rel.indexOf(b.getAttribute("data-rel")) >= 0); });
    this.$$("[data-focus]").forEach(function (b) { b.setAttribute("aria-pressed", f.focus.indexOf(b.getAttribute("data-focus")) >= 0); });
    this.$("[data-beginner]").setAttribute("aria-pressed", f.beginner);
    this.$("[data-dept]").value = f.dept;
    var q = this.$("[data-q]"); if (q.value !== f.q) q.value = f.q;
    this.$("[data-sort]").value = this.state.sort;
    this.$$("[data-view]").forEach(function (b) { b.setAttribute("aria-pressed", b.getAttribute("data-view") === self.state.view); });
  };

  Widget.prototype.renderResults = function () {
    var self = this, f = this.state.f;
    this.syncControls();
    function facetCount(g, test) { return C.filter(function (c) { return matches(c, f, g) && test(c); }).length; }
    this.$$("[data-n]").forEach(function (el) {
      var parts = el.getAttribute("data-n").split(":"), g = parts[0], v = parts.slice(1).join(":");
      var n = facetCount(g, function (c) {
        if (g === "levels") return c.level === v;
        if (g === "coding") return c.coding === v;
        if (g === "priorAI") return c.prior_ai === v;
        if (g === "colleges") return c.colleges.indexOf(v) >= 0;
        return false;
      });
      el.textContent = n;
      el.parentNode.classList.toggle("zero", n === 0 && !el.parentNode.querySelector("input").checked);
    });
    this.$$("[data-tcount]").forEach(function (el) {
      var k = el.getAttribute("data-tcount").split(":"), n;
      if (k[0] === "rel") n = facetCount("rel", function (c) { return String(c.tier) === k[1]; });
      else if (k[0] === "focus") n = facetCount("focus", function (c) { return c.focus.indexOf(k[1]) >= 0; });
      else n = facetCount("beginner", isBeginner);
      el.textContent = k[0] === "focus" ? "(" + n + ")" : n + (n === 1 ? " course" : " courses");
      el.closest(".tog").classList.toggle("zero", n === 0);
    });
    var list = C.filter(function (c) { return matches(c, f); });
    var srt = this.state.tableSort && this.state.view === "table" ? this.state.tableSort : null;
    list.sort(srt ? function (a, b) { return srt.dir * cmpCol(a, b, srt.col) || SORTS.code(a, b); } : SORTS[this.state.sort]);
    var countText = list.length === C.length ? "All " + C.length + " undergraduate courses" : list.length + " of " + C.length + " undergraduate courses match";
    this.$("[data-count]").textContent = countText;
    this.$("[data-live]").textContent = countText;
    var active = this.activePills();
    this.$("[data-active]").innerHTML = active.length ? active.map(function (p) { return '<button type="button" class="pill" data-rm="' + esc(p.key) + '">' + esc(p.label) + ' <span aria-hidden="true">×</span><span class="vh">(remove)</span></button>'; }).join("") +
      ' <button type="button" class="linkbtn" data-clear>Clear all</button>' : "";
    var box = this.$("[data-results]");
    if (!list.length) { box.innerHTML = '<div class="empty"><p><strong>No courses match all of these selections.</strong></p><p>Try removing one, or <button type="button" class="linkbtn" data-clear>clear all selections</button>.</p></div>'; return; }
    box.innerHTML = this.state.view === "table" ? this.tableHTML(list) : '<div class="grid">' + list.map(function (c) { return self.cardHTML(c); }).join("") + "</div>";
  };

  function cmpCol(a, b, col) {
    if (col === "code") return a.codes[0].localeCompare(b.codes[0], "en", { numeric: true });
    if (col === "title") return a.title.localeCompare(b.title);
    if (col === "rel") return a.tier - b.tier;
    if (col === "level") return LEVEL_ORDER.indexOf(a.level) - LEVEL_ORDER.indexOf(b.level) || (a.restricted - b.restricted);
    if (col === "coding") return ["No", "Likely", "Yes"].indexOf(a.coding) - ["No", "Likely", "Yes"].indexOf(b.coding);
    if (col === "college") return a.colleges[0].localeCompare(b.colleges[0]);
    return 0;
  }

  Widget.prototype.activePills = function () {
    var f = this.state.f, out = [];
    if (f.q) out.push({ key: "q", label: "Search: “" + f.q + "”" });
    f.rel.forEach(function (v) { out.push({ key: "rel:" + v, label: REL[v].name }); });
    if (f.beginner) out.push({ key: "beginner", label: "For AI beginners" });
    f.focus.forEach(function (v) { out.push({ key: "focus:" + v, label: META.focus_areas[v].label }); });
    f.levels.forEach(function (v) { out.push({ key: "levels:" + v, label: META.levels[v].label }); });
    f.coding.forEach(function (v) { out.push({ key: "coding:" + v, label: "Coding: " + v }); });
    f.priorAI.forEach(function (v) { out.push({ key: "priorAI:" + v, label: "Prior AI: " + v }); });
    f.colleges.forEach(function (v) { out.push({ key: "colleges:" + v, label: v.replace(/^College of /, "") }); });
    if (f.dept) out.push({ key: "dept", label: f.dept.replace(/^Department of /, "") });
    [["openUG", "Open to undergraduates"], ["aiNamed", "Names AI"], ["genEd", "Gen Ed"], ["alsoGrad", "Also in Graduate Catalog"]].forEach(function (p) { if (f[p[0]]) out.push({ key: p[0], label: p[1] }); });
    return out;
  };

      list.map(function (c) {

      '<section class="sec official"><h4>Catalog description</h4><p>' + esc(c.description) + '</p><p class="src">Official text, word for word, from the UIC Undergraduate Catalog.</p></section>' +
      '<section class="sec"><h4>Prerequisites</h4><p>' + (c.prerequisites ? linkCodes(c.prerequisites) : "<em>None listed in the catalog.</em>") + "</p></section>" +
      '<section class="sec"><h4>How it relates to AI</h4><p><strong>' + esc(REL[c.tier].name) + ".</strong> " + esc(REL[c.tier].desc) + "</p><p>" + esc(c.likely_ai) + "</p></section>" +
      contactHTML(c) +
      '<section class="sec"><h4>Quick facts</h4><div class="facts">' + facts.map(function (x) { return '<div class="fact"><span class="k">' + esc(x[0]) + "</span>" + esc(x[1]) + "</div>"; }).join("") + "</div></section>" +
      (c.codes.length > 1 ? '<section class="sec"><h4>Cross-listed</h4><p>This is one course offered under two codes: ' + esc(c.codes.join(" and ")) + ". You can register under either.</p></section>" : "") +
      (c.note ? '<section class="sec"><h4>Note</h4><p>' + esc(c.note) + "</p></section>" : "") +
      '<section class="sec"><h4>Official catalog entry</h4><div class="links">' + links + "</div>" +
      '<details class="full" style="margin-top:10px"><summary>Show the full catalog entry</summary>' + c.listings.map(function (l) { return "<p><strong>" + esc(l.code) + ".</strong> " + esc(l.full_entry) + "</p>"; }).join("") + "</details></section>" +
      "</div>";
    var ov = this.$(".overlay"), dlg = this.$(".dlg");
    dlg.innerHTML = html;
    ov.hidden = false;
    dlg.scrollTop = 0;
    this.$(".close").focus();
    if (this.deeplink) try { history.replaceState(null, "", "#course=" + slug(c.id)); } catch (e) {}
  };

  Widget.prototype.closeCourse = function () {
    var ov = this.$(".overlay"); if (ov.hidden) return;
    ov.hidden = true;
    if (this.deeplink) try { history.replaceState(null, "", window.location.pathname + window.location.search); } catch (e) {}
    if (this.lastFocus && this.lastFocus.isConnected) this.lastFocus.focus();
  };

  /* ---------- Pathways ---------- */
  Widget.prototype.renderPathways = function () {
    var st = this.state, k = st.pw, fa = META.focus_areas[k];
    var picks = Object.keys(META.focus_areas).map(function (key) {
      return '<button type="button" data-pw="' + key + '" aria-pressed="' + (key === k) + '">' + icon(FOCUS_ICON[key]) + " " + esc(META.focus_areas[key].label) + "</button>";
    }).join("");
    var pool = C.filter(function (c) { return c.focus.indexOf(k) >= 0 && (st.pwOpen ? !c.restricted : true); });
    var rungs = LEVEL_ORDER.map(function (lv, i) {
      var items = pool.filter(function (c) { return c.level === lv; }).sort(function (a, b) { return a.tier - b.tier || SORTS.code(a, b); });
      return '<div class="rung"><h4><span class="stepn" aria-hidden="true">' + (i + 1) + "</span>" + esc(META.levels[lv].label) + ' <span style="font-weight:400;color:var(--muted)">(' + items.length + ")</span></h4>" +
        '<p class="rb">' + esc(META.levels[lv].blurb) + "</p>" +
        (items.length ? items.map(function (c) {
          return '<button type="button" class="mini t' + c.tier + '" data-open="' + esc(c.id) + '"><span class="code">' + esc(codeLabel(c)) + '</span><span class="tt">' + esc(c.title) + '</span><span class="x">' + esc(REL[c.tier].short) + " · " + (c.restricted ? "Program-restricted · " : "") + "Coding: " + esc(c.coding) + "</span></button>";
        }).join("") : '<p class="none">No courses at this level.</p>') + "</div>";
    }).join("");
    this.$('[data-panel="pathways"]').innerHTML =
      '<p class="pw-intro">Pick an area to see its courses arranged as a ladder, from courses you can take now to advanced ones. Start on the left and work right as you complete prerequisites.</p>' +
      '<div class="pw-pick" role="group" aria-label="Area">' + picks + "</div>" +
      '<p class="pw-blurb"><strong>' + esc(fa.label) + ".</strong> " + esc(fa.blurb) + "</p>" +
      '<div class="pw-opts"><label><input type="checkbox" data-pwopen ' + (st.pwOpen ? "checked" : "") + "> Hide program-restricted courses</label></div>" +
      '<div class="ladder">' + rungs + "</div>";
  };

  /* ---------- Getting ready ---------- */
  Widget.prototype.renderReady = function () {
    function codes(list) { return '<div class="codes">' + list.filter(function (x) { return BY_CODE[x]; }).map(function (x) { return '<button type="button" data-open="' + x + '">' + x + "</button>"; }).join("") + "</div>"; }
    function gl(t, d) { return "<details><summary>" + esc(t) + "</summary><p>" + esc(d) + "</p></details>"; }
    var html = '<div class="gr"><h3>What does it take to learn AI?</h3>' +
      "<p>These are all undergraduate courses, and you don't have to be a programmer to study AI. There are three broad ways to get involved, and each needs different preparation. Most people end up mixing them.</p>" +
      '<div class="routes">' +
      '<div class="route"><span class="ri">' + icon("compass") + '</span><h4>Understand and question AI</h4><p>Learn how AI affects people, fairness, work, media and democracy, and how to judge claims about it.</p>' +
      '<p class="lbl">Skills that help</p><ul><li>Careful reading and writing</li><li>Discussion and argument</li><li>Curiosity about technology and society</li></ul>' +
      '<p class="lbl">Good starting courses</p>' + codes(["PHIL 113", "ENGL 254", "COMM 230", "SOC 280", "COMM 250", "LING 350", "PHIL 315"]) +
      '<button type="button" class="btn ghost go" data-gofocus="society">See the society & ethics pathway</button></div>' +
      '<div class="route"><span class="ri">' + icon("toolbox") + '</span><h4>Use AI in your field</h4><p>Apply AI tools and data methods in business, health, science, journalism or the humanities.</p>' +
      '<p class="lbl">Skills that help</p><ul><li>Basic statistics and spreadsheets</li><li>Comfort with data and charts</li><li>Knowledge of your own field</li><li>Some Python or R (often taught in the course)</li></ul>' +
      '<p class="lbl">Good starting courses</p>' + codes(["CS 218", "IDS 314", "NEUS 444", "LCSL 275", "LING 370", "EAES 380", "SOC 280"]) +
      '<button type="button" class="btn ghost go" data-gofocus="data">See the data & analytics pathway</button></div>' +
      '<div class="route"><span class="ri">' + icon("chip") + '</span><h4>Build AI systems</h4><p>Design and program machine learning models, computer vision, language AI and robots.</p>' +
      '<p class="lbl">Skills that help</p><ul><li>Programming, plus data structures (many courses require CS 251)</li><li>Probability and statistics (such as STAT 381 or IE 342)</li><li>Calculus and linear algebra</li></ul>' +
      '<p class="lbl">Common next steps</p>' + codes(["CS 411", "CS 412", "STAT 385", "CS 418", "CS 415", "CS 421", "STAT 485"]) +
      '<button type="button" class="btn ghost go" data-gofocus="build">See the Build AI pathway</button></div>' +
      "</div>" +
      '<h3>Key terms in plain language</h3><div class="gloss">' +
      gl("Artificial intelligence (AI)", "Computer systems that do tasks we usually connect with human thinking, such as understanding language, recognizing images, making decisions or solving problems.") +
      gl("Machine learning (ML)", "A kind of AI where the computer learns patterns from examples (data) instead of following rules a person wrote by hand.") +
      gl("Neural networks and deep learning", "Machine learning models loosely inspired by the brain, built from many connected layers. \"Deep\" learning means many layers. They power most modern AI.") +
      gl("Generative AI", "AI that creates new content, such as text, images, audio or code. Chatbots like ChatGPT and Claude are examples.") +
      gl("Large language model (LLM)", "A very large neural network trained on huge amounts of text so it can read and write language. It is the technology behind most chatbots.") +
      gl("Natural language processing (NLP)", "The part of AI that works with human language: translation, voice assistants, chatbots, text analysis.") +
      gl("Computer vision", "The part of AI that works with images and video: recognizing faces, objects, medical scans or road signs.") +
      gl("Data science and data mining", "Collecting, cleaning, analyzing and finding patterns in data. It is the foundation that AI is built on.") +
      gl("Algorithmic bias", "When an automated system treats some groups unfairly, often because of the data it learned from or how it was designed.") +
      gl("Prerequisite", "A course you must finish (or a status you must have) before you can enroll. \"Consent of the instructor\" means you can ask the instructor for permission instead.") +
      "</div>" +
      '<div class="tips"><strong>Tips for choosing</strong><ul>' +
      "<li><strong>Start where you are.</strong> " + C.filter(isBeginner).length + " courses need no coding or AI experience. Select <em>For AI beginners</em> on the Find courses tab.</li>" +
      "<li><strong>Read prerequisites closely.</strong> Select a course code in a course's prerequisites to jump to it, or open it in the UIC catalog.</li>" +
      "<li><strong>Ask the department.</strong> Each course lists a department contact. Ask them when a course is offered and whether it fits your plans.</li>" +
      "<li><strong>Talk to an advisor.</strong> They can tell you which courses count toward your major, minor or Gen Ed.</li>" +
      "<li><strong>Look beyond \"directly related\".</strong> Courses that are substantially or possibly related to AI teach its building blocks (data, statistics, programming) or its effects on society.</li></ul></div></div>";
    this.$('[data-panel="ready"]').innerHTML = html;
  };

  /* ---------- Saved ---------- */
  Widget.prototype.renderSaved = function () {
    var self = this, list = this.state.saved.map(function (id) { return BY_CODE[id]; }).filter(Boolean);
    var p = this.$('[data-panel="saved"]');
    if (!list.length) {
      p.innerHTML = '<div class="empty"><p><strong>Your list is empty.</strong></p><p>Select the star ' + icon("star", "inline") + ' on any course to save it here, so you can compare courses and share the list with an advisor.</p></div>' +
        (this.storageOK ? "" : '<p class="tip">Your browser is not saving data for this page, so your list will last for this visit only.</p>');
      return;
    }
    p.innerHTML = '<div class="saved-actions"><button type="button" class="btn" data-copy>Copy list</button>' +
      '<a class="btn ghost" data-mail href="#">Email list</a><button type="button" class="btn ghost" data-print>Print list</button>' +
      '<button type="button" class="btn ghost" data-clearsaved>Clear list</button><span class="status" role="status" data-status></span></div>' +
      '<div class="grid">' + list.map(function (c) { return self.cardHTML(c, "s"); }).join("") + "</div>";
    this.$("[data-mail]").setAttribute("href", "mailto:?subject=" + encodeURIComponent("UIC undergraduate AI courses I'm considering") + "&body=" + encodeURIComponent(this.savedText()));
  };

  function contactText(c) {
    return c.contacts.map(function (k) { return k.email || k.url; }).filter(Boolean).join(", ");
  }
  Widget.prototype.savedText = function () {
    return "UIC undergraduate AI courses I'm considering:\n\n" + this.state.saved.map(function (id) {
      var c = BY_CODE[id]; if (!c) return "";
      return codeLabel(c) + ": " + c.title + " (" + c.hours + "; " + REL[c.tier].name + "; " + META.levels[c.level].label + ")\n  Prerequisites: " + (c.prerequisites || "None listed") +
        "\n  Catalog: " + c.listings[0].catalog_url + "\n  Department contact: " + contactText(c);
    }).filter(Boolean).join("\n\n");
  };

  Widget.prototype.toggleSave = function (id) {
    var i = this.state.saved.indexOf(id);
    if (i >= 0) this.state.saved.splice(i, 1); else this.state.saved.push(id);
    storeSet(this.state.saved);
    this.updateSavedCount();
    var on = i < 0, c = BY_CODE[id];
    this.$$('[data-star="' + id + '"]').forEach(function (b) { b.setAttribute("aria-pressed", on); b.setAttribute("aria-label", (on ? "Remove " : "Save ") + codeLabel(c) + (on ? " from" : " to") + " my list"); });
    this.$("[data-live]").textContent = codeLabel(c) + (on ? " saved to" : " removed from") + " your list";
    if (this.state.tab === "saved") this.renderSaved();
  };
  Widget.prototype.updateSavedCount = function () { this.$("[data-savedcount]").textContent = this.state.saved.length; };

  /* ---------- Events ---------- */
  function toggleIn(arr, v) { var i = arr.indexOf(v); if (i >= 0) arr.splice(i, 1); else arr.push(v); }

  Widget.prototype.bind = function () {
    var self = this, R = this.root, st = this.state, qTimer;
    function refocus(sel) { var b = self.$(sel); if (b) b.focus(); return !!b; }
    R.addEventListener("input", function (e) {
      var t = e.target;
      if (t.hasAttribute("data-q")) { clearTimeout(qTimer); qTimer = setTimeout(function () { st.f.q = t.value.trim(); self.renderResults(); }, 150); }
    });
    R.addEventListener("change", function (e) {
      var t = e.target;
      if (t.hasAttribute("data-f")) { toggleIn(st.f[t.getAttribute("data-f")], t.value); self.renderResults(); }
      else if (t.hasAttribute("data-t")) { st.f[t.getAttribute("data-t")] = t.checked; self.renderResults(); }
      else if (t.hasAttribute("data-dept")) { st.f.dept = t.value; self.renderResults(); }
      else if (t.hasAttribute("data-sort")) { st.sort = t.value; st.tableSort = null; self.renderResults(); }
      else if (t.hasAttribute("data-pwopen")) { st.pwOpen = t.checked; self.renderPathways(); }
    });
    R.addEventListener("click", function (e) {
      var t = e.target.closest ? e.target.closest("button, a") : null;
      if (!t) { if (e.target.classList && e.target.classList.contains("overlay")) self.closeCourse(); return; }
      var a;
      if ((a = t.getAttribute("data-open"))) { e.preventDefault(); self.openCourse(a, self.$(".overlay").hidden ? t : self.lastFocus); return; }
      if ((a = t.getAttribute("data-star"))) { self.toggleSave(a); return; }
      if ((a = t.getAttribute("data-tab"))) { self.setTab(a); return; }
      if (t.hasAttribute("data-close")) { self.closeCourse(); return; }
      if ((a = t.getAttribute("data-rel"))) { toggleIn(st.f.rel, a); self.renderResults(); return; }
      if ((a = t.getAttribute("data-focus"))) { toggleIn(st.f.focus, a); self.renderResults(); return; }
      if (t.hasAttribute("data-beginner")) { st.f.beginner = !st.f.beginner; self.renderResults(); return; }
      if (t.hasAttribute("data-clear")) { st.f = blankFilters(); self.renderResults(); refocus("[data-q]"); return; }
      if ((a = t.getAttribute("data-rm"))) {
        var parts = a.split(":");
        if (parts.length > 1) { var arr = st.f[parts[0]]; arr.splice(arr.indexOf(parts.slice(1).join(":")), 1); }
        else if (a === "q" || a === "dept") st.f[a] = ""; else st.f[a] = false;
        self.renderResults(); refocus("[data-active] .pill") || refocus("[data-q]"); return;
      }
      if ((a = t.getAttribute("data-view"))) { st.view = a; self.renderResults(); return; }
      if ((a = t.getAttribute("data-tsort"))) { st.tableSort = { col: a, dir: st.tableSort && st.tableSort.col === a ? -st.tableSort.dir : 1 }; self.renderResults(); refocus('[data-tsort="' + a + '"]'); return; }
      if ((a = t.getAttribute("data-pw"))) { st.pw = a; self.renderPathways(); refocus('[data-pw="' + a + '"]'); return; }
      if ((a = t.getAttribute("data-gofocus"))) { st.pw = a; self.setTab("pathways"); refocus("#" + self.uid + "-tab-pathways"); return; }
      if (t.hasAttribute("data-ftoggle")) { var fl = self.$(".filters"), open = !fl.classList.contains("open"); fl.classList.toggle("open", open); t.setAttribute("aria-expanded", open); return; }
      if (t.classList.contains("info")) { var tip = self.$("#" + t.getAttribute("aria-controls")); var ex = t.getAttribute("aria-expanded") === "true"; t.setAttribute("aria-expanded", !ex); tip.hidden = ex; return; }
      if (t.hasAttribute("data-copy")) {
        var txt = self.savedText(), status = self.$("[data-status]");
        var done = function () { status.textContent = "Copied to clipboard."; };
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, function () { fallbackCopy(txt); done(); });
        else { fallbackCopy(txt); done(); }
        return;
      }
      if (t.hasAttribute("data-print")) { self.printSaved(); return; }
      if (t.hasAttribute("data-clearsaved")) { st.saved = []; storeSet([]); self.updateSavedCount(); self.renderSaved(); self.$("[data-live]").textContent = "List cleared"; return; }
    });
    R.addEventListener("keydown", function (e) {
      var ov = self.$(".overlay");
      if (!ov.hidden) {
        if (e.key === "Escape") { e.preventDefault(); self.closeCourse(); return; }
        if (e.key === "Tab") {
          var f = Array.prototype.slice.call(self.$(".dlg").querySelectorAll("button, a[href], summary, input, select")).filter(function (x) { return x.offsetParent !== null; });
          if (!f.length) return;
          var act = self.root.activeElement, first = f[0], last = f[f.length - 1];
          if (e.shiftKey && act === first) { e.preventDefault(); last.focus(); } else if (!e.shiftKey && act === last) { e.preventDefault(); first.focus(); }
        }
        return;
      }
      if (e.target.getAttribute && e.target.getAttribute("role") === "tab" && (e.key === "ArrowRight" || e.key === "ArrowLeft")) {
        var tabs = self.$$("[role=tab]"), i = tabs.indexOf(e.target), n = tabs[(i + (e.key === "ArrowRight" ? 1 : tabs.length - 1)) % tabs.length];
        self.setTab(n.getAttribute("data-tab")); n.focus(); e.preventDefault();
      }
    });
  };

  Widget.prototype.printSaved = function () {
    var list = this.state.saved.map(function (id) { return BY_CODE[id]; }).filter(Boolean);
    var color = { 1: "#001E62", 2: "#D50032", 3: "#5B6B82" };
    var body = "<h1 style='color:#001E62'>UIC undergraduate AI courses I'm considering</h1><p style='color:#555'>Catalog information only. Course text from the " + esc(META.catalog_year) + " UIC Undergraduate Catalog. Ask the department or your advisor before planning your schedule.</p>" +
      list.map(function (c) {
        return "<div style='border-left:6px solid " + color[c.tier] + ";padding:6px 12px;margin:12px 0;break-inside:avoid'><h2 style='margin:0;font-size:16px'>" + esc(codeLabel(c)) + ": " + esc(c.title) + "</h2>" +
          "<p style='margin:4px 0;font-size:13px;color:#555'>" + esc(c.hours) + " · " + esc(REL[c.tier].name) + " · " + esc(META.levels[c.level].label) + "</p>" +
          "<p style='margin:4px 0'><strong>Catalog description:</strong> " + esc(c.description) + "</p><p style='margin:4px 0'><strong>Prerequisites:</strong> " + esc(c.prerequisites || "None listed") + "</p>" +
          "<p style='margin:4px 0;font-size:13px'>Catalog: " + esc(c.listings[0].catalog_url) + "<br>Department contact: " + esc(contactText(c)) + "</p></div>";
      }).join("");
    var win = null;
    try { win = window.open("", "_blank"); } catch (e) {}
    if (!win) { this.$("[data-status]").textContent = "Your browser blocked the print window. Use Copy list instead."; return; }
    win.document.write("<!doctype html><html lang='en'><head><meta charset='utf-8'><title>My UIC AI course list</title></head><body style='font:15px/1.5 -apple-system,Segoe UI,Arial,sans-serif;max-width:760px;margin:24px auto;padding:0 16px'>" + body + "</body></html>");
    win.document.close(); win.focus(); win.print();
  };

  function fallbackCopy(txt) {
    var ta = document.createElement("textarea"); ta.value = txt; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); } catch (e) {} document.body.removeChild(ta);
  }
  function uniq(a) { return a.filter(function (x, i) { return a.indexOf(x) === i; }); }
  function flat(a) { return [].concat.apply([], a); }

  function init() {
    var els = document.querySelectorAll("[data-uic-ai-courses], #uic-ai-courses");
    Array.prototype.forEach.call(els, function (el) { if (!el.__uicAi) { el.__uicAi = new Widget(el); } });
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init); else init();
})();

})();
</script>
